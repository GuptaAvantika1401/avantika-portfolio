<section id="experience" class="py-16 px-6">
  <div class="max-w-6xl mx-auto">
    <h2 class="text-3xl md:text-4xl font-bold text-center text-indigo-800 mb-14">
      Experience
    </h2>

    <div class="relative">
      <!-- Vertical Line -->
      <div class="absolute left-1/2 transform -translate-x-1/2 top-0 bottom-0 w-1 
                  bg-gradient-to-b from-indigo-400 via-purple-500 to-pink-500 
                  shadow-[0_0_20px_rgba(168,85,247,0.6)]"></div>

      <!-- Timeline Items -->
      <div class="space-y-24">
        <div *ngFor="let exp of experiences; let i = index" class="flex flex-col md:flex-row md:justify-between relative">

          <!-- LEFT SIDE (Odd index) -->
          <div *ngIf="i % 2 === 0" class="md:w-5/12 text-right" @slideInLeft>
            <div class="exp-card text-right">
              <h3 class="text-xl font-semibold text-gray-900">{{ exp.company }}</h3>
              <p class="text-sm text-gray-600 mb-2">{{ exp.duration }}</p>
              <p class="text-gray-800 leading-relaxed mb-3">{{ exp.description }}</p>
              <div class="flex flex-wrap gap-2 justify-end">
                <span *ngFor="let tech of exp.highlights" 
                      class="px-3 py-1 text-sm rounded-full bg-indigo-100 text-indigo-700">
                  {{ tech }}
                </span>
              </div>
            </div>
          </div>

          <!-- RIGHT SIDE (Even index) -->
          <div *ngIf="i % 2 !== 0" class="md:w-5/12 md:ml-auto" @slideInRight>
            <div class="exp-card text-left">
              <h3 class="text-xl font-semibold text-gray-900">{{ exp.company }}</h3>
              <p class="text-sm text-gray-600 mb-2">{{ exp.duration }}</p>
              <p class="text-gray-800 leading-relaxed mb-3">{{ exp.description }}</p>
              <div class="flex flex-wrap gap-2 justify-start">
                <span *ngFor="let tech of exp.highlights" 
                      class="px-3 py-1 text-sm rounded-full bg-indigo-100 text-indigo-700">
                  {{ tech }}
                </span>
              </div>
            </div>
          </div>

          <!-- Orb Center -->
          <div class="absolute left-1/2 transform -translate-x-1/2 -translate-y-1/2 top-1/2" @fadeScale>
            <div class="w-20 h-20 rounded-full flex flex-col items-center justify-center 
                        text-white font-bold shadow-lg year-badge"
                 [ngClass]="orbColors[i % orbColors.length]">
              <span>{{ exp.date.split(' ')[0] }}</span>
              <span>{{ exp.date.split(' ')[1] }}</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
